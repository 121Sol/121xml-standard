<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: bold; fill: #1E2761; }
      .section { font-size: 12px; font-weight: bold; fill: #FFFFFF; }
      .label { font-size: 11px; fill: #1A1A1A; }
      .small { font-size: 10px; fill: #5C6673; }
      .arrow { stroke: #1E2761; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .pass { stroke: #2C5F2D; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); }
      .fail { stroke: #9E2B25; stroke-width: 2; fill: none; marker-end: url(#arrowhead-red); }
      .box-l0 { fill: #E8EDF5; stroke: #1E2761; }
      .box-l1 { fill: #E8EDF5; stroke: #1E2761; }
      .box-l2 { fill: #F1F7F1; stroke: #2C5F2D; }
      .box-l3 { fill: #F1F7F1; stroke: #2C5F2D; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1E2761"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2C5F2D"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9E2B25"/>
    </marker>
  </defs>

  <text x="700" y="30" text-anchor="middle" class="title">121XML Validation Pipeline: Conformance Levels L0 → L3</text>

  <!-- INPUT -->
  <rect x="550" y="60" width="300" height="50" fill="#1E2761" rx="3"/>
  <text x="700" y="90" text-anchor="middle" class="section">INPUT: 121XML Packet</text>

  <line x1="700" y1="110" x2="700" y2="140" class="arrow"/>

  <!-- L0: SYNTACTIC -->
  <rect x="50" y="140" width="300" height="140" class="box-l0" rx="3" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" class="label" font-weight="bold">L0: Syntactic Validation</text>
  <text x="60" y="185" class="small">□ Well-formed XML/JSON?</text>
  <text x="60" y="200" class="small">□ Type tags valid?</text>
  <text x="60" y="215" class="small">  (&lt;str&gt;, &lt;int&gt;, &lt;seq&gt;, &lt;map&gt;)</text>
  <text x="60" y="235" class="small">✓ COST: Free</text>
  <text x="60" y="250" class="small">✓ DISTRIBUTION: Self-service validator</text>

  <line x1="350" y1="210" x2="400" y2="210" class="pass"/>
  <text x="375" y="205" class="small" fill="#2C5F2D">PASS</text>

  <line x1="200" y1="280" x2="200" y2="310" class="pass"/>
  <text x="210" y="295" class="small" fill="#2C5F2D">✓</text>

  <!-- L1: STRUCTURAL -->
  <rect x="50" y="310" width="300" height="160" class="box-l1" rx="3" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" class="label" font-weight="bold">L1: Structural Validation</text>
  <text x="60" y="355" class="small">Axioms A1–A3:</text>
  <text x="60" y="370" class="small">□ No inheritance (A1)?</text>
  <text x="60" y="385" class="small">□ All types tagged (A2)?</text>
  <text x="60" y="400" class="small">□ Sequences homogeneous (A3)?</text>
  <text x="60" y="420" class="small">✓ Codegen succeeds in all 6 langs</text>
  <text x="60" y="435" class="small">✓ COST: Free, CI action</text>

  <line x1="350" y1="390" x2="400" y2="390" class="pass"/>
  <text x="375" y="385" class="small" fill="#2C5F2D">PASS</text>

  <line x1="200" y1="470" x2="200" y2="500" class="pass"/>

  <!-- L2: CANONICAL -->
  <rect x="50" y="500" width="300" height="180" class="box-l2" rx="3" stroke-width="2"/>
  <text x="200" y="525" text-anchor="middle" class="label" font-weight="bold">L2: Canonical Validation</text>
  <text x="60" y="545" class="small">Rules R4–R6:</text>
  <text x="60" y="560" class="small">□ Keys sorted (R4)?</text>
  <text x="60" y="575" class="small">□ Null explicit (R5)?</text>
  <text x="60" y="590" class="small">□ Profile/version declared (R6)?</text>
  <text x="60" y="610" class="small">✓ Hashes stable & repeatable</text>
  <text x="60" y="625" class="small">✓ Signable for provenance</text>
  <text x="60" y="640" class="small">✓ COST: Paid enterprise subscription</text>

  <line x1="350" y1="590" x2="400" y2="590" class="pass"/>
  <text x="375" y="585" class="small" fill="#2C5F2D">PASS</text>

  <line x1="200" y1="680" x2="200" y2="710" class="pass"/>

  <!-- L3: ROUND-TRIP CERTIFIED -->
  <rect x="50" y="710" width="300" height="200" class="box-l3" rx="3" stroke-width="2"/>
  <text x="200" y="735" text-anchor="middle" class="label" font-weight="bold">L3: Round-Trip Certified</text>
  <text x="60" y="755" class="small">Rule R7 — The Testable Promise:</text>
  <text x="60" y="770" class="small">□ Source → 121XML → Source</text>
  <text x="60" y="785" class="small">  must be byte-identical?</text>
  <text x="60" y="805" class="small">✓ Annual audit & re-certification</text>
  <text x="60" y="820" class="small">✓ Published field-coverage report</text>
  <text x="60" y="835" class="small">✓ Failures documented & disclosed</text>
  <text x="60" y="850" class="small">✓ COST: Paid, highest value cert</text>

  <line x1="350" y1="810" x2="400" y2="810" class="pass"/>
  <text x="375" y="805" class="small" fill="#2C5F2D">PASS</text>

  <line x1="200" y1="910" x2="200" y2="940" class="pass"/>

  <!-- CERTIFICATE ISSUANCE -->
  <rect x="50" y="940" width="300" height="50" fill="#2C5F2D" rx="3"/>
  <text x="200" y="970" text-anchor="middle" class="section">✓ CERTIFICATE ISSUED</text>

  <!-- PARALLEL: TEST HARNESS -->
  <rect x="450" y="140" width="450" height="850" fill="none" stroke="#B8791C" stroke-width="2" stroke-dasharray="5,5" rx="3"/>
  <text x="675" y="165" text-anchor="middle" class="label" font-weight="bold">ROUND-TRIP TEST HARNESS (R7 Implementation)</text>

  <!-- Test setup -->
  <rect x="470" y="180" width="410" height="100" fill="#FEF6F1" stroke="#B8791C" stroke-width="1" rx="3"/>
  <text x="675" y="205" text-anchor="middle" class="label" font-weight="bold">Step 1: Setup</text>
  <text x="480" y="225" class="small">• Load 100 representative records from system</text>
  <text x="480" y="240" class="small">• Profile: which fields should survive? What's optional?</text>
  <text x="480" y="255" class="small">• Create baseline: original format, exact state</text>

  <line x1="675" y1="280" x2="675" y2="310" class="arrow"/>

  <!-- Export to 121XML -->
  <rect x="470" y="310" width="410" height="100" fill="#F1F7F1" stroke="#2C5F2D" stroke-width="1" rx="3"/>
  <text x="675" y="335" text-anchor="middle" class="label" font-weight="bold">Step 2: Export to 121XML</text>
  <text x="480" y="355" class="small">• Serialise all 100 records → 121XML format</text>
  <text x="480" y="370" class="small">• Apply R4: sort keys, make canonical</text>
  <text x="480" y="385" class="small">• Compute __hash for each record (R7)</text>

  <line x1="675" y1="410" x2="675" y2="440" class="arrow"/>

  <!-- Import back -->
  <rect x="470" y="440" width="410" height="100" fill="#F1F7F1" stroke="#2C5F2D" stroke-width="1" rx="3"/>
  <text x="675" y="465" text-anchor="middle" class="label" font-weight="bold">Step 3: Import Back</text>
  <text x="480" y="485" class="small">• Parse 121XML format (schema-free)</text>
  <text x="480" y="500" class="small">• Deserialise to original domain objects</text>
  <text x="480" y="515" class="small">• Verify hash for each record (R7)</text>

  <line x1="675" y1="540" x2="675" y2="570" class="arrow"/>

  <!-- Byte compare -->
  <rect x="470" y="570" width="410" height="110" fill="#FEF6F1" stroke="#B8791C" stroke-width="1" rx="3"/>
  <text x="675" y="595" text-anchor="middle" class="label" font-weight="bold">Step 4: Byte-Level Comparison</text>
  <text x="480" y="615" class="small">• Original vs. Re-imported, field by field</text>
  <text x="480" y="630" class="small">• For each record: name every field that changed</text>
  <text x="480" y="645" class="small">• Collect statistics: % of fields intact, % of records</text>

  <!-- Split to pass/fail -->
  <line x1="560" y1="680" x2="480" y2="730" class="pass"/>
  <text x="515" y="705" class="small" fill="#2C5F2D">PASS</text>

  <line x1="790" y1="680" x2="870" y2="730" class="fail"/>
  <text x="810" y="705" class="small" fill="#9E2B25">FAIL</text>

  <!-- Pass -->
  <rect x="400" y="730" width="150" height="80" fill="#F1F7F1" stroke="#2C5F2D" stroke-width="2" rx="3"/>
  <text x="475" y="755" text-anchor="middle" class="label" font-weight="bold">✓ PASS</text>
  <text x="410" y="775" class="small">Fields intact</text>
  <text x="410" y="795" class="small">Eligible for L3</text>

  <!-- Fail -->
  <rect x="850" y="730" width="150" height="80" fill="#FBF6F5" stroke="#9E2B25" stroke-width="2" rx="3"/>
  <text x="925" y="755" text-anchor="middle" class="label" font-weight="bold">✗ FAIL</text>
  <text x="860" y="775" class="small">Field loss detected</text>
  <text x="860" y="795" class="small">Root cause needed</text>

  <!-- Report -->
  <rect x="470" y="820" width="410" height="100" fill="#F7F9FC" stroke="#1E2761" stroke-width="1" rx="3"/>
  <text x="675" y="845" text-anchor="middle" class="label" font-weight="bold">Step 5: Publish Results</text>
  <text x="480" y="865" class="small">• Field coverage scoreboard: which fields round-trip?</text>
  <text x="480" y="880" class="small">• Include FAILURES prominently (not a weakness)</text>
  <text x="480" y="895" class="small">• Date and version: repeatable, auditable</text>

  <!-- RIGHT SIDE: SCOREBOARD EXAMPLE -->
  <rect x="950" y="140" width="400" height="830" fill="none" stroke="#DFE4EC" stroke-width="2" rx="3"/>
  <text x="1150" y="170" text-anchor="middle" class="label" font-weight="bold">Example: Conformance Scoreboard</text>

  <rect x="970" y="190" width="360" height="30" fill="#1E2761" rx="2"/>
  <text x="1150" y="212" text-anchor="middle" class="section">Field Coverage Report</text>

  <text x="980" y="235" class="small" font-weight="bold">Contact-to-121XML Round-Trip (100 records)</text>
  <text x="980" y="255" class="small">Test Date: 2026-07-23 | Version: 1.1 | Status: PASS</text>

  <rect x="970" y="270" width="360" height="25" fill="#E8EDF5" stroke="#1E2761" stroke-width="1"/>
  <text x="985" y="288" class="small"><tspan font-weight="bold">Field Name</tspan><tspan x="1130" font-weight="bold">Status</tspan><tspan x="1280" font-weight="bold">Notes</tspan></text>

  <line x1="970" y1="295" x2="1330" y2="295" stroke="#DFE4EC" stroke-width="1"/>

  <text x="985" y="315" class="small">email</text>
  <text x="1130" y="315" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="315" class="small">100/100</text>

  <text x="985" y="335" class="small">name</text>
  <text x="1130" y="335" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="335" class="small">100/100</text>

  <text x="985" y="355" class="small">phone</text>
  <text x="1130" y="355" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="355" class="small">100/100</text>

  <text x="985" y="375" class="small">address.city</text>
  <text x="1130" y="375" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="375" class="small">98/100</text>

  <text x="985" y="395" class="small">address.zip</text>
  <text x="1130" y="395" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="395" class="small">87/100</text>

  <text x="985" y="415" class="small">tags (seq)</text>
  <text x="1130" y="415" class="small" fill="#2C5F2D" font-weight="bold">✓ PASS</text>
  <text x="1280" y="415" class="small">100/100</text>

  <text x="985" y="435" class="small">internal_id</text>
  <text x="1130" y="435" class="small" fill="#9E2B25" font-weight="bold">✗ FAIL</text>
  <text x="1280" y="435" class="small">Lost in export</text>

  <text x="985" y="455" class="small">created_at</text>
  <text x="1130" y="455" class="small" fill="#9E2B25" font-weight="bold">✗ FAIL</text>
  <text x="1280" y="455" class="small">TZ mismatch</text>

  <rect x="970" y="480" width="360" height="1" stroke="#DFE4EC" stroke-width="1"/>

  <text x="985" y="505" class="small" font-weight="bold">Overall: 8/10 fields (80%) perfect round-trip</text>
  <text x="985" y="525" class="small" fill="#B8791C">⚠ Actions needed:</text>
  <text x="985" y="540" class="small">• internal_id: include in export?</text>
  <text x="985" y="555" class="small">• created_at: standardise timezone (UTC)</text>
  <text x="985" y="570" class="small">• address.zip: 13% fields empty — expected?</text>

  <text x="985" y="595" class="small" font-weight="bold">Recommendation: L2 Canonical</text>
  <text x="985" y="610" class="small">(L3 Round-Trip pending fixes above)</text>

  <rect x="970" y="630" width="360" height="50" fill="#FEF6F1" stroke="#B8791C" stroke-width="1" rx="2"/>
  <text x="1150" y="650" text-anchor="middle" class="small" font-weight="bold">Failures disclosed openly</text>
  <text x="1150" y="667" text-anchor="middle" class="small">This honesty is what makes L3 credible</text>
</svg>
