<svg width="1400" height="1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #1E2761; }
      .subtitle { font-size: 14px; fill: #5C6673; }
      .section-title { font-size: 13px; font-weight: bold; fill: #FFFFFF; }
      .label { font-size: 12px; fill: #1A1A1A; }
      .small { font-size: 11px; fill: #5C6673; }
      .arrow { stroke: #1E2761; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .data-flow { stroke: #2C5F2D; stroke-width: 2; fill: none; marker-end: url(#arrowhead-green); stroke-dasharray: 5,5; }
      .box-header { fill: #1E2761; }
      .box-green { fill: #F1F7F1; stroke: #2C5F2D; }
      .box-amber { fill: #FEF6F1; stroke: #B8791C; }
      .box-navy { fill: #E8EDF5; stroke: #1E2761; }
      .box-white { fill: #FFFFFF; stroke: #DFE4EC; }
      .line-sep { stroke: #DFE4EC; stroke-width: 1; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1E2761"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2C5F2D"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="700" y="30" text-anchor="middle" class="title">121XML Technical Architecture</text>
  <text x="700" y="50" text-anchor="middle" class="subtitle">Implementation layers, data flow, and integration patterns</text>

  <!-- LAYER 1: SOURCE SYSTEMS -->
  <rect x="50" y="80" width="1300" height="50" class="box-header" rx="4"/>
  <text x="70" y="110" class="section-title">LAYER 1: SOURCE SYSTEMS</text>

  <rect x="70" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="145" y="160" text-anchor="middle" class="label" font-weight="bold">Legacy System A</text>
  <text x="145" y="180" text-anchor="middle" class="small">(JSON, XML)</text>

  <rect x="260" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="335" y="160" text-anchor="middle" class="label" font-weight="bold">External API</text>
  <text x="335" y="180" text-anchor="middle" class="small">(REST, gRPC)</text>

  <rect x="450" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="525" y="160" text-anchor="middle" class="label" font-weight="bold">Database</text>
  <text x="525" y="180" text-anchor="middle" class="small">(SQL, NoSQL)</text>

  <rect x="640" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="715" y="160" text-anchor="middle" class="label" font-weight="bold">AI/LLM Tool</text>
  <text x="715" y="180" text-anchor="middle" class="small">(Claude, GPT)</text>

  <rect x="830" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="905" y="160" text-anchor="middle" class="label" font-weight="bold">Event Stream</text>
  <text x="905" y="180" text-anchor="middle" class="small">(Kafka, Pub/Sub)</text>

  <rect x="1020" y="140" width="150" height="60" class="box-white" rx="4" stroke-width="1"/>
  <text x="1095" y="160" text-anchor="middle" class="label" font-weight="bold">Contact Graph</text>
  <text x="1095" y="180" text-anchor="middle" class="small">(Google, Apple)</text>

  <!-- Arrows down -->
  <line x1="145" y1="200" x2="145" y2="230" class="arrow"/>
  <line x1="335" y1="200" x2="335" y2="230" class="arrow"/>
  <line x1="525" y1="200" x2="525" y2="230" class="arrow"/>
  <line x1="715" y1="200" x2="715" y2="230" class="arrow"/>
  <line x1="905" y1="200" x2="905" y2="230" class="arrow"/>
  <line x1="1095" y1="200" x2="1095" y2="230" class="arrow"/>

  <!-- LAYER 2: CONVERSION GATEWAY -->
  <rect x="50" y="230" width="1300" height="60" class="box-header" rx="4"/>
  <text x="70" y="265" class="section-title">LAYER 2: CONVERSION GATEWAY (Inbound)</text>

  <rect x="70" y="300" width="280" height="100" class="box-amber" rx="4" stroke-width="2"/>
  <text x="210" y="325" text-anchor="middle" class="label" font-weight="bold">Profile Loader</text>
  <text x="210" y="345" text-anchor="middle" class="small">Read 121XML profile URI</text>
  <text x="210" y="360" text-anchor="middle" class="small">Extract field mapping</text>
  <text x="210" y="375" text-anchor="middle" class="small">Validate schema constraints</text>

  <rect x="400" y="300" width="280" height="100" class="box-amber" rx="4" stroke-width="2"/>
  <text x="540" y="325" text-anchor="middle" class="label" font-weight="bold">Type Enforcement (A1–A3)</text>
  <text x="540" y="345" text-anchor="middle" class="small">No inheritance (A1)</text>
  <text x="540" y="360" text-anchor="middle" class="small">Tag all polymorphic fields (A2)</text>
  <text x="540" y="375" text-anchor="middle" class="small">Homogeneous sequences (A3)</text>

  <rect x="730" y="300" width="280" height="100" class="box-amber" rx="4" stroke-width="2"/>
  <text x="870" y="325" text-anchor="middle" class="label" font-weight="bold">Canonical Transformation</text>
  <text x="870" y="345" text-anchor="middle" class="small">Sort map keys (R4)</text>
  <text x="870" y="360" text-anchor="middle" class="small">Normalise null/absent (R5)</text>
  <text x="870" y="375" text-anchor="middle" class="small">Compute SHA-256 (R7)</text>

  <rect x="1060" y="300" width="260" height="100" class="box-amber" rx="4" stroke-width="2"/>
  <text x="1190" y="325" text-anchor="middle" class="label" font-weight="bold">Integrity Envelope</text>
  <text x="1190" y="345" text-anchor="middle" class="small">Verify hash (R7)</text>
  <text x="1190" y="360" text-anchor="middle" class="small">Check version (R6)</text>
  <text x="1190" y="375" text-anchor="middle" class="small">Detect tampering</text>

  <!-- Horizontal flow -->
  <line x1="350" y1="350" x2="400" y2="350" class="arrow"/>
  <line x1="680" y1="350" x2="730" y2="350" class="arrow"/>
  <line x1="1010" y1="350" x2="1060" y2="350" class="arrow"/>

  <!-- Arrow down -->
  <line x1="700" y1="400" x2="700" y2="430" class="arrow"/>

  <!-- LAYER 3: INTERNAL REPRESENTATION -->
  <rect x="50" y="430" width="1300" height="50" class="box-header" rx="4"/>
  <text x="70" y="460" class="section-title">LAYER 3: CANONICAL 121XML (In-Memory Representation)</text>

  <rect x="70" y="500" width="1260" height="80" class="box-green" rx="4" stroke-width="2"/>
  <text x="90" y="525" class="label" font-weight="bold">Canonical 121XML Object Tree</text>
  <text x="90" y="545" class="small">• Profile URI and version (R6) declared</text>
  <text x="90" y="560" class="small">• All keys canonically sorted (R4)</text>
  <text x="90" y="575" class="small">• Null explicitly tagged; absent keys preserved (R5)</text>

  <!-- Arrow down -->
  <line x1="700" y1="580" x2="700" y2="610" class="arrow"/>

  <!-- LAYER 4: OUTPUT PATHS (Three parallel flows) -->
  <rect x="50" y="610" width="1300" height="50" class="box-header" rx="4"/>
  <text x="70" y="640" class="section-title">LAYER 4: OUTPUT TRANSFORMATION (Three Parallel Paths)</text>

  <!-- Path A: Storage -->
  <rect x="70" y="680" width="280" height="120" class="box-navy" rx="4" stroke-width="2"/>
  <text x="210" y="705" text-anchor="middle" class="label" font-weight="bold">Path A: Storage</text>
  <line x1="80" y1="720" x2="340" y2="720" class="line-sep"/>
  <text x="90" y="740" class="small">• Serialize to disk</text>
  <text x="90" y="755" class="small">• Append __hash field</text>
  <text x="90" y="770" class="small">• Sign if required (R7)</text>
  <text x="90" y="785" class="small">• Store immutably</text>

  <!-- Path B: Parser/Codegen -->
  <rect x="400" y="680" width="280" height="120" class="box-navy" rx="4" stroke-width="2"/>
  <text x="540" y="705" text-anchor="middle" class="label" font-weight="bold">Path B: Codegen</text>
  <line x1="410" y1="720" x2="670" y2="720" class="line-sep"/>
  <text x="410" y="740" class="small">• Generate Rust structs</text>
  <text x="410" y="755" class="small">• Generate Python classes</text>
  <text x="410" y="770" class="small">• Generate Java POJOs</text>
  <text x="410" y="785" class="small">• Generate C++ types</text>

  <!-- Path C: Transmission -->
  <rect x="730" y="680" width="280" height="120" class="box-navy" rx="4" stroke-width="2"/>
  <text x="870" y="705" text-anchor="middle" class="label" font-weight="bold">Path C: Transmission</text>
  <line x1="740" y1="720" x2="1000" y2="720" class="line-sep"/>
  <text x="740" y="740" class="small">• Serialize to XML/JSON</text>
  <text x="740" y="755" class="small">• Add __hash signature</text>
  <text x="740" y="770" class="small">• Transmit over wire</text>
  <text x="740" y="785" class="small">• Optional encryption</text>

  <!-- Path D: Reference -->
  <rect x="1060" y="680" width="260" height="120" class="box-navy" rx="4" stroke-width="2"/>
  <text x="1190" y="705" text-anchor="middle" class="label" font-weight="bold">Path D: Reference</text>
  <line x1="1070" y1="720" x2="1310" y2="720" class="line-sep"/>
  <text x="1070" y="740" class="small">• Generate HTML docs</text>
  <text x="1070" y="755" class="small">• Generate schema</text>
  <text x="1070" y="770" class="small">• Build sample records</text>
  <text x="1070" y="785" class="small">• Coverage scoreboard</text>

  <!-- Arrows out to four paths -->
  <line x1="630" y1="610" x2="210" y2="680" class="arrow"/>
  <line x1="700" y1="610" x2="540" y2="680" class="arrow"/>
  <line x1="770" y1="610" x2="870" y2="680" class="arrow"/>
  <line x1="830" y1="610" x2="1190" y2="680" class="arrow"/>

  <!-- LAYER 5: CONSUMPTION LAYER -->
  <rect x="50" y="830" width="1300" height="50" class="box-header" rx="4"/>
  <text x="70" y="860" class="section-title">LAYER 5: CONSUMPTION (Receiver Side)</text>

  <!-- Three consumption patterns -->
  <rect x="70" y="900" width="350" height="140" class="box-white" rx="4" stroke-width="1"/>
  <text x="245" y="925" text-anchor="middle" class="label" font-weight="bold">Pattern A: Schema-Free Parser</text>
  <line x1="80" y1="940" x2="410" y2="940" class="line-sep"/>
  <text x="90" y="960" class="small">1. Read profile URI (R6)</text>
  <text x="90" y="975" class="small">2. For each element, read</text>
  <text x="90" y="990" class="small">   type tag before allocating</text>
  <text x="90" y="1005" class="small">3. Parse homogeneous seqs</text>
  <text x="90" y="1020" class="small">4. Verify hash at end (R7)</text>

  <rect x="480" y="900" width="350" height="140" class="box-white" rx="4" stroke-width="1"/>
  <text x="655" y="925" text-anchor="middle" class="label" font-weight="bold">Pattern B: Generated Code</text>
  <line x1="490" y1="940" x2="820" y2="940" class="line-sep"/>
  <text x="490" y="960" class="small">1. Receive 121XML packet</text>
  <text x="490" y="975" class="small">2. Call generated deserialiser</text>
  <text x="490" y="990" class="small">3. Deserialiser reads type</text>
  <text x="490" y="1005" class="small">   tags, allocates memory</text>
  <text x="490" y="1020" class="small">4. Objects ready to use</text>

  <rect x="890" y="900" width="350" height="140" class="box-white" rx="4" stroke-width="1"/>
  <text x="1065" y="925" text-anchor="middle" class="label" font-weight="bold">Pattern C: Conformance Check</text>
  <line x1="900" y1="940" x2="1230" y2="940" class="line-sep"/>
  <text x="900" y="960" class="small">1. Parse 121XML packet</text>
  <text x="900" y="975" class="small">2. Validate against L0–L3</text>
  <text x="900" y="990" class="small">3. Check R4–R7 constraints</text>
  <text x="900" y="1005" class="small">4. Report conformance level</text>
  <text x="900" y="1020" class="small">5. Issue certificate if L2/L3</text>

  <!-- RIGHT SIDE: VALIDATION & CERTIFICATION -->
  <rect x="50" y="100" width="250" height="750" class="box-green" rx="4" stroke-width="2" opacity="0.1"/>

  <!-- Legend box -->
  <rect x="1180" y="1020" width="170" height="160" class="box-white" rx="4" stroke-width="1"/>
  <text x="1265" y="1040" text-anchor="middle" class="label" font-weight="bold">Conformance Levels</text>
  <line x1="1190" y1="1050" x2="1340" y2="1050" class="line-sep"/>
  <text x="1195" y="1067" class="small"><tspan font-weight="bold">L0:</tspan> Syntactic</text>
  <text x="1195" y="1082" class="small"><tspan font-weight="bold">L1:</tspan> Structural (free)</text>
  <text x="1195" y="1097" class="small"><tspan font-weight="bold">L2:</tspan> Canonical (paid)</text>
  <text x="1195" y="1112" class="small"><tspan font-weight="bold">L3:</tspan> Round-trip cert</text>
</svg>
