version: '3.8'

services:
  121xml-website:
    image: nginx:latest
    container_name: 121xml-website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./website_v3_complete.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    environment:
      - TZ=UTC
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - 121xml-network

networks:
  121xml-network:
    driver: bridge
