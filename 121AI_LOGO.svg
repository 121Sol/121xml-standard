<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2463;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06D6A0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (optional) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#F5F7FA" stroke-width="2" opacity="0.3"/>

  <!-- Left node (1) -->
  <circle cx="50" cy="100" r="12" fill="#0A2463" filter="url(#glow)"/>
  <circle cx="50" cy="100" r="8" fill="#06D6A0" opacity="0.6"/>

  <!-- Center node (2) - larger, represents AI core -->
  <circle cx="100" cy="100" r="16" fill="url(#logoGradient)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="10" fill="none" stroke="#F5F7FA" stroke-width="2"/>

  <!-- Circuit pattern inside center node -->
  <line x1="90" y1="100" x2="110" y2="100" stroke="#F5F7FA" stroke-width="1.5" opacity="0.8"/>
  <line x1="100" y1="90" x2="100" y2="110" stroke="#F5F7FA" stroke-width="1.5" opacity="0.8"/>

  <!-- Right node (1) -->
  <circle cx="150" cy="100" r="12" fill="#0A2463" filter="url(#glow)"/>
  <circle cx="150" cy="100" r="8" fill="#06D6A0" opacity="0.6"/>

  <!-- Connection paths (glowing lines) -->
  <!-- Left to center -->
  <path d="M 62 100 Q 75 85 88 100" stroke="#06D6A0" stroke-width="2.5" fill="none" filter="url(#glow)" opacity="0.8"/>
  <circle cx="70" cy="92" r="2" fill="#F39C12" opacity="0.7"/>

  <!-- Center to right -->
  <path d="M 112 100 Q 125 115 138 100" stroke="#06D6A0" stroke-width="2.5" fill="none" filter="url(#glow)" opacity="0.8"/>
  <circle cx="130" cy="108" r="2" fill="#F39C12" opacity="0.7"/>

  <!-- AI indicator: small circuit elements around center -->
  <g opacity="0.6">
    <rect x="95" y="75" width="10" height="10" fill="none" stroke="#F39C12" stroke-width="1.5" rx="2"/>
    <circle cx="100" cy="80" r="1.5" fill="#F39C12"/>

    <rect x="110" y="95" width="10" height="10" fill="none" stroke="#F39C12" stroke-width="1.5" rx="2"/>
    <circle cx="115" cy="100" r="1.5" fill="#F39C12"/>

    <rect x="85" y="105" width="10" height="10" fill="none" stroke="#F39C12" stroke-width="1.5" rx="2"/>
    <circle cx="90" cy="110" r="1.5" fill="#F39C12"/>
  </g>

  <!-- Subtle text below (optional, can be used with logo) -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0A2463" letter-spacing="1">121AI</text>

  <!-- Decorative accent lines representing "universal translation" -->
  <g opacity="0.3" stroke="#0A2463" stroke-width="1">
    <line x1="40" y1="50" x2="160" y2="50"/>
    <line x1="40" y1="150" x2="160" y2="150"/>
  </g>
</svg>
